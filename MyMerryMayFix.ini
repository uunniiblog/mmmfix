[Overlay]
; Supported names: F1 through F12, INSERT, HOME, END, DELETE.
Hotkey=F12

[Graphics]
; 0 = Off, 1 = 4:3 pillarbox
AspectMode=1
; 1 = sprites may extend over the bars, 0 = black bars cover sprite overflow.
SpritesOverPillarbox=1
; Experimental: retain the game's background vertex shader for zooming and motion.
; 0 = Fixed-image.
; 1 = motion-aware for 4:3 assets. (Intended behaviour)
; Restart the game after changing this. Other texture sizes keep the established path.
ExperimentalBackgroundMotion=1
; ADV textbox only. 100 = original alpha, range 0 through 200.
TextboxOpacity=100
; ADV textbox target color. 255,255,255 = exact original rendering.
TextboxColorR=255
TextboxColorG=255
TextboxColorB=255

[Text]
; 1 = voiced dialogue uses the normal configured text reveal speed.
; Voice playback and auto-mode timing remain unchanged.
MatchVoicedTextSpeed=0

[Audio]
; 1 = advancing to unvoiced dialogue does not stop the current voice.
; The next voiced line still replaces it normally.
ContinueVoiceUntilNextVoice=1

[Rendering]
; Render the engine's 1080p intermediates at a higher resolution.
; 0 = disabled, 1 = enabled. Restart the game after changing this.
HighResolution=1
; 0,0 uses the active monitor size. Set both for an explicit resolution.
Width=0
Height=0

[Input]
; 1 = restore the custom cursor/DirectInput mouse after focus loss, 0 = original behavior.
RestoreCursor=1

; Controller support Original Steam Input action bridge.
XInputNativeActions=0

; 1 = use the first connected XInput controller.
; Works on Windows and Proton when the controller is visible to XInput.
; Requires XInputNativeActions to be disabled
XInputEnabled=0

[Controller]
; 各ボタンにゲーム内キーを割り当てます。キー名は SPACE、F1～F12、A～Z、数字、矢印など。
; NONE=割り当てなし、LEFTMOUSE/RIGHTMOUSE=マウスクリック。設定変更後はゲームを再起動してください。
; RBなどにF12を割り当てると、そのボタンでもオーバーレイを開閉できます（[Overlay] Hotkeyと同じキー）。
; A/B/X/Y/Start/Back/LB/RB/方向キーはXInputNativeActions=0のときに使用します。
; LT/RT/L3/R3は追加割り当てとして両モードで使用できます。LT/RTはアナログトリガーです。
; SPACE：決定／テキスト送り
A=SPACE
; X：戻る／キャンセル
B=X
; G：オートモードのON/OFF
X=G
; 2：バックログ
Y=2
; 1：システムメニューの表示
Start=1
; X：キャンセル／テキストウィンドウのON/OFF
Back=X
; Q：強制スキップ／ページ切り替え（左）
LB=Q
; E：スキップモードのON/OFF／ページ切り替え（右）
RB=E
; R：クイックセーブ
LT=R
; F：クイックロード
RT=F
; 未割り当て（例：F1=マニュアル、F10=タイトルに戻る、F11=フルスクリーン）
L3=NONE
; 未割り当て
R3=NONE
; ↑：カーソル移動
Up=UP
; ↓：カーソル移動
Down=DOWN
; →：カーソル移動
Right=RIGHT
; ←：カーソル移動
Left=LEFT

[Debug]
; Write diagnostic events to MyMerryMayFix.log.
Logging=0
; 1 = Advanced motion logging (requires Logging=1).
; Samples stop after about 20 seconds; open F12 to reset for another capture.
BackgroundMotionDiagnostics=0
; 1 = log XInput slots/button activity and the game's DirectInput device calls.
; Requires Logging=1. Diagnostics only: does not change controller input.
ControllerDiagnostics=0
; 1 = log ADV wrapping calls and the engine state at a wrapping crash.
; Requires Logging=1. Restart after changing this.
WrappingDiagnostics=0

[ExperimentalWrapping]
; ADV body only; NVL/backlog/other layouts always retain their original width.
; Overlay changes apply to the next dialogue line.
; 0 = no ADV width override, 1 = enable ADV width override.
Enabled=1
; Maximum line width in engine units; 0 = log only, without changing wrapping.
; 1300-1350 is the most accurate range, reducing it more can make long lines break out of sight.
Width=1320


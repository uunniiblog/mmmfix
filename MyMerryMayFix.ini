[Overlay]
; Supported names: F1 through F12, INSERT, HOME, END, DELETE.
Hotkey=F12

[Graphics]
; 0 = Off, 1 = 4:3 pillarbox
AspectMode=1
; 1 = sprites may extend over the bars, 0 = black bars cover sprite overflow.
SpritesOverPillarbox=1
; Experimental: retain the game's background vertex shader for zooming and motion.
; 0 = Fixed-image.
; 1 = motion-aware for 4:3 assets. (Intended behaviour)
; Restart the game after changing this. Other texture sizes keep the established path.
ExperimentalBackgroundMotion=1
; ADV textbox only. 100 = original alpha, range 0 through 200.
TextboxOpacity=100
; ADV textbox target color. 255,255,255 = exact original rendering.
TextboxColorR=255
TextboxColorG=255
TextboxColorB=255

[Text]
; 1 = voiced dialogue uses the normal configured text reveal speed.
; Voice playback and auto-mode timing remain unchanged.
MatchVoicedTextSpeed=0

[Audio]
; 1 = advancing to unvoiced dialogue does not stop the current voice.
; The next voiced line still replaces it normally.
ContinueVoiceUntilNextVoice=1

[Rendering]
; Render the engine's 1080p intermediates at a higher resolution.
; 0 = disabled, 1 = enabled. Restart the game after changing this.
HighResolution=1
; 0,0 uses the active monitor size. Set both for an explicit resolution.
Width=0
Height=0

[Input]
; 1 = restore the custom cursor/DirectInput mouse after focus loss, 0 = original behavior.
RestoreCursor=1

[Debug]
; Write diagnostic events to MyMerryMayFix.log.
Logging=0
; 1 = Advanced motion logging (requires Logging=1).
; Samples stop after about 20 seconds; open F12 to reset for another capture.
BackgroundMotionDiagnostics=0

[ExperimentalWrapping]
; Windows and Proton. Restart the game after changing these values.
; 0 = no ADV width override, 1 = enable ADV width override.
Enabled=1
; Maximum line width in engine units; 0 = log only, without changing wrapping.
; Leave at 1320 for 4:3, should be good.
Width=1320
; ADV body only; NVL/backlog/other layouts always retain their original width.
; Caller=0 or 1 enables the observed ADV caller. 2..6 change no text.
Caller=0

